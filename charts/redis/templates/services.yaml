# Service headless : identité DNS stable de chaque pod (redis-N.redis-headless).
# publishNotReadyAddresses : les pods doivent se résoudre entre eux AVANT d'être Ready
# (bootstrap, découverte Sentinel, resynchronisation d'un réplica).
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    {{- include "redis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
# Point d'entrée Sentinel pour les clients, y compris depuis un autre namespace
# (REDIS_SENTINELS=redis-sentinel.<namespace>.svc.cluster.local:26379). Pas de Service
# "master" : les clients découvrent le master via Sentinel, qui leur répond par le FQDN du
# pod (redis-N.redis-headless.<namespace>.svc.<domaine>), résolvable de tout namespace.
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  labels:
    {{- include "redis.labels" . | nindent 4 }}
    {{- include "redis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sentinel
spec:
  type: ClusterIP
  selector:
    {{- include "redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
