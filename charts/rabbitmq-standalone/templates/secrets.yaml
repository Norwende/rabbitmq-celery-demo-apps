{{- /*
Secrets générés au premier install puis CONSERVÉS (même technique que Secret/redis-auth du
chart redis) : à chaque upgrade, lookup relit le Secret existant et réutilise ses valeurs.
Une rotation casserait le cluster (cookie Erlang) ou ne servirait à rien (l'administrateur
n'est créé qu'au premier démarrage). resource-policy keep : ils survivent à helm uninstall,
une réinstallation les reprend avec les PVC (mêmes données, même cookie). Hors ligne (helm
template, lint), lookup renvoie vide : valeurs aléatoires rendues, sans effet.
*/}}
{{- if not .Values.erlangCookie.existingSecret }}
{{- $cookie := randAlphaNum 64 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "rabbitmq-erlang-cookie" }}
{{- if and $existing $existing.data }}
{{- $cookie = index $existing.data ".erlang.cookie" | default $cookie }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-erlang-cookie
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  .erlang.cookie: {{ $cookie | quote }}
{{- end }}
{{- if not .Values.auth.existingSecret }}
---
{{- /* Mêmes clés username / password que le Secret de l'opérateur : la documentation et les
scripts (UI de management) fonctionnent avec les deux variantes. */}}
{{- $username := printf "default_user_%s" (randAlphaNum 20) | b64enc }}
{{- $password := randAlphaNum 32 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "rabbitmq-default-user" }}
{{- if and $existing $existing.data }}
{{- $username = index $existing.data "username" | default $username }}
{{- $password = index $existing.data "password" | default $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-default-user
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
{{- end }}
