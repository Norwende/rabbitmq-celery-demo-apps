{{- /*
Cluster RabbitMQ sans opérateur. Reprend ce que génère le RabbitMQ Cluster Operator v2.23
(StatefulSet rabbitmq-server de la variante par défaut) : nom de nœud long, ports, sondes,
preStop, securityContext, anti-affinité, répartition. Différences : peer discovery
classic_config (pas de plugin k8s, donc ni ServiceAccount, ni Role, ni token d'API) et un
init container qui empêche deux nœuds neufs de former deux clusters (files/init.sh).
*/}}
{{- $sts := include "rabbitmq.statefulSetName" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $sts }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  serviceName: {{ include "rabbitmq.headlessService" . }}
  # Parallel (comme l'opérateur, et recommandé par la documentation RabbitMQ) : après un
  # arrêt complet, un nœud ne termine son démarrage qu'avec une majorité de pairs (Khepri) ;
  # avec OrderedReady, rabbitmq-server-0 attendrait des pairs jamais lancés. Les rolling
  # updates restent séquentiels (un pod à la fois, en attendant qu'il soit prêt).
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  # Données conservées par défaut à la désinstallation et au scale-down (comme le chart
  # redis) : une réinstallation reprend les PVC avec le même cookie (Secret conservé).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "rabbitmq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rabbitmq.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: orderflow
      annotations:
        # Configuration, plugins ou script modifiés => rolling update (avec preStop).
        checksum/config: {{ include "rabbitmq.configChecksum" . }}
    spec:
      # Aucun accès à l'API Kubernetes : ni ServiceAccount dédié, ni token monté.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # utilisateur "rabbitmq" de l'image officielle
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Un seul nœud k8s ici : rien de "required", sinon les pods 2 et 3 resteraient Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "rabbitmq.selectorLabels" . | nindent 20 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "rabbitmq.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "rabbitmq.selectorLabels" . | nindent 14 }}

      initContainers:
        - name: setup
          image: {{ include "rabbitmq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "/scripts/init.sh"]
          env:
            {{- include "rabbitmq.nodeEnv" . | nindent 12 }}
            - name: STATEFULSET_NAME
              value: {{ $sts }}
            - name: REPLICAS
              value: {{ .Values.replicas | quote }}
            - name: FORMATION_TIMEOUT_SECONDS
              value: {{ .Values.init.formationTimeoutSeconds | quote }}
          resources:
            {{- toYaml .Values.init.resources | nindent 12 }}
          securityContext:
            {{- include "rabbitmq.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /var/lib/rabbitmq
            - name: persistence
              mountPath: /var/lib/rabbitmq/mnesia
            - name: erlang-cookie
              mountPath: /tmp/erlang-cookie
            - name: config
              mountPath: /scripts/init.sh
              subPath: init.sh

      containers:
        - name: rabbitmq
          image: {{ include "rabbitmq.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "rabbitmq.nodeEnv" . | nindent 12 }}
            - name: RABBITMQ_ENABLED_PLUGINS_FILE
              value: /etc/rabbitmq-plugins/enabled_plugins
            # Interpolés dans conf.d/10-orderflow.conf (default_user / default_pass).
            - name: RABBITMQ_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ include "rabbitmq.adminSecret" . }}, key: username}
            - name: RABBITMQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "rabbitmq.adminSecret" . }}, key: password}
          ports:
            - {name: epmd, containerPort: 4369}
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
            - {name: prometheus, containerPort: 15692}
            - {name: stream, containerPort: 5552}
            - {name: cluster-rpc, containerPort: 25672}
          # Démarrage : le cluster a atteint sa taille cible (target_cluster_size_hint),
          # point de santé sans authentification du plugin management (sonde de l'opérateur).
          startupProbe:
            httpGet:
              path: /api/health/checks/reached-target-cluster-size
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # Prêt = port AMQP ouvert, comme l'opérateur. Volontairement pas une vérification
          # qui suppose tous les pairs présents (elle bloquerait un redémarrage complet).
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Comme l'opérateur : attendre que l'arrêt de ce nœud ne fasse perdre la
                # majorité à aucune quorum queue / stream, puis drain (maintenance : clients
                # déconnectés, leaders transférés). Forcer un arrêt sans attente :
                #   kubectl label pod <pod> skipPreStopChecks=true
                command:
                  - bash
                  - -c
                  - >-
                    if [ -n "$(cat /etc/pod-info/skipPreStopChecks)" ]; then exit 0; fi;
                    rabbitmq-upgrade await_online_quorum_plus_one -t {{ .Values.terminationGracePeriodSeconds }}
                    && rabbitmq-upgrade drain -t {{ .Values.terminationGracePeriodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "rabbitmq.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /var/lib/rabbitmq
            - name: persistence
              mountPath: /var/lib/rabbitmq/mnesia
            # Remplace tout conf.d de l'image : seuls les fichiers du chart sont chargés.
            - name: confd
              mountPath: /etc/rabbitmq/conf.d
            - name: plugins
              mountPath: /etc/rabbitmq-plugins
            - name: pod-info
              mountPath: /etc/pod-info

      volumes:
        # $HOME du conteneur : cookie Erlang copié par l'init container.
        - name: home
          emptyDir:
            sizeLimit: 16Mi
        - name: erlang-cookie
          secret:
            secretName: {{ include "rabbitmq.cookieSecret" . }}
            items:
              - {key: .erlang.cookie, path: .erlang.cookie}
        - name: config
          configMap:
            name: rabbitmq-config
            defaultMode: 0444
        - name: confd
          configMap:
            name: rabbitmq-config
            items:
              - {key: 10-orderflow.conf, path: 10-orderflow.conf}
              - {key: 90-userDefinedConfiguration.conf, path: 90-userDefinedConfiguration.conf}
        - name: plugins
          configMap:
            name: rabbitmq-config
            items:
              - {key: enabled_plugins, path: enabled_plugins}
        - name: pod-info
          downwardAPI:
            items:
              - path: skipPreStopChecks
                fieldRef:
                  fieldPath: metadata.labels['skipPreStopChecks']

  # Même nom que celui de l'opérateur (PVC persistence-rabbitmq-server-N). Immuable :
  # uniquement des labels stables.
  volumeClaimTemplates:
    - metadata:
        name: persistence
        labels:
          {{- include "rabbitmq.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
