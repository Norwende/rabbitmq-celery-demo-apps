# Scripts du StatefulSet Redis (sources : files/redis/). Nom fixe : c'est l'annotation
# checksum/scripts du pod template qui déclenche le rolling update quand un script change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-scripts
  labels:
    {{- include "orderflow-infra.labels" . | nindent 4 }}
    {{- include "orderflow-infra.redis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
data:
  {{- include "orderflow-infra.redis.scripts" . | nindent 2 }}
