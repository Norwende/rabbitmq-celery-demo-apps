{{- if not .Values.redis.auth.existingSecret }}
{{- /*
Mot de passe aléatoire au premier install, puis CONSERVÉ : à chaque upgrade, lookup relit
le Secret existant et réutilise sa valeur (aucune rotation, qui casserait Redis/Sentinel
déjà configurés). Hors ligne (helm template, lint), lookup renvoie vide : une valeur
aléatoire est rendue, sans effet sur le cluster.
resource-policy keep : le Secret survit à helm uninstall (une réinstallation le reprend) ;
scripts/destroy.ps1 le supprime avec le namespace.
*/}}
{{- $password := randAlphaNum 32 | b64enc }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "redis-auth" }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "password" | default $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  labels:
    {{- include "orderflow-infra.labels" . | nindent 4 }}
    {{- include "orderflow-infra.redis.selectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | quote }}
{{- end }}
