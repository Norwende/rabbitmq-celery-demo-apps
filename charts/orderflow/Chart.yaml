apiVersion: v2
name: orderflow
description: >-
  Applications OrderFlow : gateway FastAPI, workers Celery (payments, inventory, notifier),
  scheduler (Celery beat) et abonnés du stream orders.events. Requiert les releases rabbitmq
  et redis (namespace infraNamespace) et, dans son propre namespace, les Secrets
  rabbitmq-credentials et redis-credentials (provisionnés par scripts/deploy-apps.ps1).
type: application
version: 0.1.0
# Tag par défaut des images orderflow/<service> (image.tag vide => appVersion).
appVersion: "dev"
kubeVersion: ">=1.29.0-0"
keywords:
  - celery
  - rabbitmq
  - fastapi
