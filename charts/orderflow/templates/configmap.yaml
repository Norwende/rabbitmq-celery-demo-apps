{{- include "orderflow.credentialsCheck" . }}
# Configuration commune à toutes les applications (cf. docs/contracts.md §2).
# Les secrets (RABBITMQ_USER/PASSWORD, REDIS_PASSWORD) viennent de Secret/{{ .Values.rabbitmq.secretName }}
# et Secret/{{ .Values.redis.secretName }} de ce namespace (provisionnés par scripts/deploy-apps.ps1), pas d'ici.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  labels:
    {{- include "orderflow.labels" (dict "root" $ "name" "orderflow-config" "component" "config") | nindent 4 }}
data:
  {{- include "orderflow.configData" . | nindent 2 }}
