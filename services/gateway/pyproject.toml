[project]
name = "orderflow-gateway"
version = "0.1.0"
description = "OrderFlow HTTP gateway: validates orders and emits the Celery chain by task name."
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]==5.7.0",
    "fastapi==0.162.4",
    "pydantic==2.14.3",
    "redis==8.1.0",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway"

[tool.pytest.ini_options]
testpaths = ["tests"]
