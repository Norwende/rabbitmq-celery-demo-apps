[project]
name = "orderflow-subscriber"
version = "0.1.0"
description = "OrderFlow stream subscriber (plain kombu): consumes orders.events from its own offset."
requires-python = ">=3.13,<3.14"
dependencies = [
    "kombu==5.7.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "subscriber"

[tool.pytest.ini_options]
testpaths = ["tests"]
