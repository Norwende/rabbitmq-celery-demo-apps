[project]
name = "orderflow-worker-notifier"
version = "0.1.0"
description = "OrderFlow Celery worker: notifications.order_confirmed, notifications.order_failed (queue notifications)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "amqp==5.4.2",
    "celery[redis]==5.7.0",
    "kombu==5.7.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "notifier"

[tool.pytest.ini_options]
testpaths = ["tests"]
